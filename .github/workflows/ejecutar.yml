name: Ejecutar main.py diariamente

on:
  schedule:
    - cron: '30 15 * * *'  # 11:30 PM Pekín (UTC+8) = 15:30 UTC (30 minutos antes de las 12 AM)

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Ejecutar main.py desde la raíz del repositorio
        run: python ./main.py
      
      - name: Configurar Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Guardar respuesta.txt
        run: |
          if [ -f respuesta.txt ]; then
            git add respuesta.txt
            git commit -m "Actualizar respuesta.txt - $(date)"
            git push
          else
            echo "respuesta.txt no fue generado"
          fi
